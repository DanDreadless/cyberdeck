id: snmpwalk
name: snmpwalk
description: Dump SNMP data (users, processes, software, interfaces) with a community string
category: recon
safety: intrusive
ports: [161]
detect:
  binary: snmpwalk
  apt: snmp
  version_cmd: ["snmpwalk", "-V"]
  version_regex: 'NET-SNMP version: (\S+)'
  help_cmd: ["snmpwalk", "-h"]
inputs:
  target:
    from: target_ip
    label: Target
    help: "Host running SNMP (UDP 161)."
options:
  - id: version
    flag: -v
    type: choice
    choices: ["1", "2c"]
    default: "2c"
    label: SNMP version (-v)
    help: "2c works on most boxes; try 1 if 2c gets no answer."
  - id: community
    flag: -c
    type: string
    default: public
    label: Community (-c)
    help: "The SNMP 'password'. public is the default; onesixtyone can guess others."
  - id: oid
    type: string
    label: OID
    help: "Subtree to walk, e.g. 1.3.6.1.2.1.25.4.2.1.2 (running processes) or NET-SNMP-EXTEND-MIB::nsExtendObjects. Empty = the standard tree."
  - id: timeout
    flag: -t
    type: int
    default: 5
    label: Timeout (-t)
    help: "Seconds to wait per request."
    advanced: true
presets:
  processes: { oid: "1.3.6.1.2.1.25.4.2.1.2" }
  software: { oid: "1.3.6.1.2.1.25.6.3.1.2" }
  extend: { oid: "NET-SNMP-EXTEND-MIB::nsExtendObjects" }
command:
  - snmpwalk
  - "{opt.version}"
  - "{opt.community}"
  - "{opt.timeout}"
  - -Oa
  - "{extra}"
  - "{target}"
  - "{opt.oid}"
timeout: 900
outputs: []
parser: none
notes: "Output is on the job's stdout. Look for usernames, passwords in process arguments, and installed software."
learn: https://book.hacktricks.xyz/network-services-pentesting/pentesting-snmp
teach:
  does: >
    Reads the host's management data over [[snmp|SNMP]] with a community string (a shared
    password, 'public' by default).
  look_for: >
    Running processes with their command lines (passwords sometimes sit in arguments),
    usernames, installed software and other network interfaces.
